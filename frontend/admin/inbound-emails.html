<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Inbox - Admin Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/style.css?v=1.3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .inbox-card {
      background: var(--bg-secondary, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      transition: all 0.2s ease-in-out;
    }

    [data-theme="dark"] .inbox-card {
      background: #111827;
      border-color: #1f2937;
    }

    .badge-unread { background-color: rgba(37, 99, 235, 0.12); color: #2563eb; border: 1px solid rgba(37, 99, 235, 0.3); font-weight: 700; }
    .badge-read { background-color: rgba(100, 116, 139, 0.12); color: #64748b; border: 1px solid rgba(100, 116, 139, 0.3); font-weight: 600; }
    .badge-replied { background-color: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 700; }
    .badge-archived { background-color: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); font-weight: 600; }

    .email-item-row {
      transition: background-color 0.15s ease;
    }
    .email-item-row:hover {
      background-color: rgba(37, 99, 235, 0.04) !important;
    }
    .email-row-unread {
      font-weight: 700;
      background-color: rgba(37, 99, 235, 0.03);
    }
    [data-theme="dark"] .email-row-unread {
      background-color: rgba(37, 99, 235, 0.08);
    }

    .email-body-box {
      background-color: var(--bg-primary, #f8fafc);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 8px;
      padding: 18px;
      min-height: 140px;
      max-height: 420px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary) !important;
    }
    
    .quick-template-btn {
      border: 1px dashed #94a3b8;
      background-color: transparent;
      color: var(--text-primary);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quick-template-btn:hover {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .search-filter-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .inbox-tab-pill {
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px !important;
      padding: 8px 16px;
    }
  </style>
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trackify">
  <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">
</head>
<body>

  <div class="app-layout">
    <!-- Unified App Sidebar -->
    <aside class="app-sidebar"></aside>

    <!-- Main Content -->
    <div class="app-main-wrapper">
      <header class="app-header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">Support Inbox &amp; Inbound Messages</h1>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <main class="app-content">
        <div class="container-fluid p-0">
          
          <!-- Filter & Search Toolbar -->
          <div class="search-filter-bar mb-4">
            <div class="row g-3 align-items-center">
              <div class="col-md-7">
                <div class="nav nav-pills" id="inboxTabs">
                  <button class="nav-link inbox-tab-pill active me-2" onclick="setFilterStatus('all')"><i class="bi bi-inbox me-1"></i> All Messages</button>
                  <button class="nav-link inbox-tab-pill me-2" onclick="setFilterStatus('unread')"><i class="bi bi-envelope-exclamation me-1"></i> Unread <span id="unreadTabBadge" class="badge bg-danger rounded-pill ms-1">0</span></button>
                  <button class="nav-link inbox-tab-pill me-2" onclick="setFilterStatus('replied')"><i class="bi bi-reply-all me-1"></i> Replied</button>
                  <button class="nav-link inbox-tab-pill" onclick="setFilterStatus('archived')"><i class="bi bi-archive me-1"></i> Archived</button>
                </div>
              </div>
              <div class="col-md-5 d-flex gap-2 justify-content-md-end">
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span>
                  <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search sender or subject..." oninput="handleSearch()">
                </div>
                <button class="btn btn-outline-secondary px-3" onclick="loadEmails()" title="Refresh Inbox"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
            </div>
          </div>

          <!-- Email List Table Card -->
          <div class="inbox-card shadow-sm">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th style="width: 140px;">Status</th>
                    <th>Sender (From)</th>
                    <th>Subject</th>
                    <th style="width: 190px;">Received At</th>
                    <th style="width: 140px; text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody id="emailTableBody">
                  <tr>
                    <td colspan="5" class="text-center py-5 text-muted">
                      <span class="spinner-border spinner-border-sm me-2"></span>Loading support emails...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Pagination Controls -->
          <div class="d-flex justify-content-between align-items-center mt-3" id="paginationControls">
            <small class="text-muted" id="paginationInfo"></small>
            <div>
              <button class="btn btn-sm btn-outline-secondary me-1" id="prevBtn" onclick="changePage(-1)" disabled><i class="bi bi-chevron-left"></i> Previous</button>
              <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="changePage(1)" disabled>Next <i class="bi bi-chevron-right"></i></button>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Email Details & Reply Modal -->
  <div class="modal fade" id="emailDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="modalSubject">Email Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
          <div class="p-3 mb-3 border rounded-3 bg-body-tertiary">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <div class="fw-bold fs-6 text-body" id="modalFrom"></div>
                <div class="text-muted small">To: <span id="modalTo" class="fw-semibold"></span></div>
              </div>
              <div class="text-end">
                <span id="modalStatusBadge" class="badge badge-unread mb-1">Unread</span>
                <div class="text-muted small" id="modalDate"></div>
              </div>
            </div>
          </div>

          <label class="form-label fw-bold text-secondary small text-uppercase">Original Email Content:</label>
          <div class="email-body-box mb-4" id="modalBody"></div>

          <!-- Previous Reply Section -->
          <div id="previousReplyBox" class="alert alert-success border-success-subtle d-none mb-4">
            <h6 class="fw-bold mb-1"><i class="bi bi-check-circle-fill me-1"></i> Response Dispatched (<span id="modalRepliedDate"></span>):</h6>
            <div id="modalReplyText" class="small mt-2" style="white-space: pre-wrap;"></div>
          </div>

          <!-- Reply Composer Form -->
          <div class="border rounded-3 p-3 bg-body">
            <h6 class="fw-bold mb-3 d-flex align-items-center"><i class="bi bi-reply-fill text-primary me-2 fs-5"></i> Send Support Response</h6>
            
            <div class="mb-3">
              <label class="form-label small text-muted font-monospace">Canned Response Templates:</label>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="quick-template-btn" onclick="applyTemplate('account_approved')">🎓 Account Approved</button>
                <button type="button" class="quick-template-btn" onclick="applyTemplate('attendance_resolved')">📊 Attendance Corrected</button>
                <button type="button" class="quick-template-btn" onclick="applyTemplate('tech_issue_resolved')">🛠️ Tech Issue Fixed</button>
                <button type="button" class="quick-template-btn" onclick="applyTemplate('support_ack')">💬 Support Received</button>
              </div>
            </div>

            <div class="mb-3">
              <label for="replyTextarea" class="form-label small fw-bold">Message Text Body:</label>
              <textarea class="form-control" id="replyTextarea" rows="5" placeholder="Type your custom response message here..."></textarea>
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-primary px-4 fw-semibold" id="sendReplyBtn" onclick="submitEmailReply()">
                <span class="spinner-border spinner-border-sm me-1 d-none" id="replySpinner"></span>
                <i class="bi bi-send-fill me-1"></i> Send Reply via Resend
              </button>
            </div>
          </div>
        </div>

        <div class="modal-footer justify-content-between border-top">
          <div>
            <button type="button" class="btn btn-sm btn-outline-warning" onclick="toggleArchiveCurrentEmail()"><i class="bi bi-archive me-1"></i> Archive</button>
            <button type="button" class="btn btn-sm btn-outline-danger ms-1" onclick="deleteCurrentEmail()"><i class="bi bi-trash me-1"></i> Delete</button>
          </div>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <!-- Unified Navigation Script -->
  <script src="/assets/js/app-nav.js"></script>
  
  <script>
    let currentFilter = 'all';
    let currentSearch = '';
    let currentPage = 1;
    let currentEmailId = null;
    let currentEmailData = null;
    let detailModal = null;

    document.addEventListener('DOMContentLoaded', () => {
      detailModal = new bootstrap.Modal(document.getElementById('emailDetailModal'));
      loadEmails();
    });

    function setFilterStatus(status) {
      currentFilter = status;
      currentPage = 1;
      
      document.querySelectorAll('#inboxTabs .nav-link').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      loadEmails();
    }

    let searchTimeout = null;
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearch = document.getElementById('searchInput').value.trim();
        currentPage = 1;
        loadEmails();
      }, 300);
    }

    async function loadEmails() {
      const tbody = document.getElementById('emailTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading support messages...</td></tr>';

      try {
        const query = new URLSearchParams({
          page: currentPage,
          limit: 15,
          status: currentFilter,
          search: currentSearch
        });

        const res = await fetch(`/api/admin/inbound-emails?${query.toString()}`, { credentials: 'include' });
        const json = await res.json();

        if (!json.success) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${json.message || 'Error loading emails'}</td></tr>`;
          return;
        }

        const unreadCount = json.unreadCount || 0;
        document.getElementById('unreadTabBadge').innerText = unreadCount;

        if (!json.data || json.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">No support messages found.</td></tr>';
          updatePagination(0, 1, 15);
          return;
        }

        tbody.innerHTML = json.data.map(item => {
          const isUnread = item.status === 'unread';
          let badgeClass = 'badge-read';
          if (item.status === 'unread') badgeClass = 'badge-unread';
          if (item.status === 'replied') badgeClass = 'badge-replied';
          if (item.status === 'archived') badgeClass = 'badge-archived';

          return `
            <tr class="email-item-row ${isUnread ? 'email-row-unread' : ''}" style="cursor: pointer;" onclick="openEmailDetail('${item.id}')">
              <td><span class="badge ${badgeClass} text-uppercase">${item.status}</span></td>
              <td class="text-truncate" style="max-width: 220px;" title="${escapeHtml(item.from_address)}">${escapeHtml(item.from_address)}</td>
              <td class="text-truncate" style="max-width: 320px;" title="${escapeHtml(item.subject)}">${escapeHtml(item.subject)}</td>
              <td class="small text-muted">${new Date(item.received_at).toLocaleString()}</td>
              <td text-align="right" onclick="event.stopPropagation()">
                <button class="btn btn-sm btn-outline-primary fw-semibold" onclick="openEmailDetail('${item.id}')">View &amp; Reply</button>
              </td>
            </tr>
          `;
        }).join('');

        updatePagination(json.pagination.total, json.pagination.page, json.pagination.limit);
      } catch (err) {
        console.error('Error fetching emails:', err);
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Failed to connect to server.</td></tr>';
      }
    }

    function updatePagination(total, page, limit) {
      const totalPages = Math.ceil(total / limit) || 1;
      const start = total === 0 ? 0 : (page - 1) * limit + 1;
      const end = Math.min(page * limit, total);
      
      document.getElementById('paginationInfo').innerText = `Showing ${start}-${end} of ${total} support messages`;
      document.getElementById('prevBtn').disabled = (page <= 1);
      document.getElementById('nextBtn').disabled = (page >= totalPages);
    }

    function changePage(delta) {
      currentPage += delta;
      loadEmails();
    }

    async function openEmailDetail(id) {
      currentEmailId = id;
      document.getElementById('replyTextarea').value = '';
      
      try {
        const res = await fetch(`/api/admin/inbound-emails/${id}`, { credentials: 'include' });
        const json = await res.json();
        if (!json.success) {
          alert(json.message || 'Could not load email details');
          return;
        }

        currentEmailData = json.data;
        document.getElementById('modalSubject').innerText = currentEmailData.subject || '(No Subject)';
        document.getElementById('modalFrom').innerText = currentEmailData.from_address;
        document.getElementById('modalTo').innerText = currentEmailData.to_address;
        document.getElementById('modalDate').innerText = new Date(currentEmailData.received_at).toLocaleString();
        
        const badge = document.getElementById('modalStatusBadge');
        badge.innerText = currentEmailData.status.toUpperCase();
        badge.className = `badge badge-${currentEmailData.status} mb-1`;

        const modalBody = document.getElementById('modalBody');
        let bodyContent = '';

        if (currentEmailData.html_body && currentEmailData.html_body.trim().length > 0) {
          let cleanedHtml = currentEmailData.html_body
            .replace(/<!DOCTYPE[^>]*>/gi, '')
            .replace(/<html[^>]*>/gi, '')
            .replace(/<\/html>/gi, '')
            .replace(/<head[^>]*>[\s\S]*?<\/head>/gi, '')
            .replace(/<body[^>]*>/gi, '')
            .replace(/<\/body>/gi, '');
          bodyContent = cleanedHtml;
        } else if (currentEmailData.text_body && currentEmailData.text_body.trim().length > 0) {
          let formattedText = escapeHtml(currentEmailData.text_body)
            .replace(/\n/g, '<br>')
            .replace(/(https?:\/\/[^\s<]+)/gi, '<a href="$1" target="_blank" rel="noopener" style="color: #2563eb;">$1</a>');
          bodyContent = `<div style="font-family: inherit; white-space: pre-wrap; word-break: break-word;">${formattedText}</div>`;
        } else {
          bodyContent = '<em class="text-muted">No message body content available.</em>';
        }

        modalBody.innerHTML = bodyContent;

        const prevBox = document.getElementById('previousReplyBox');
        if (currentEmailData.status === 'replied' && currentEmailData.reply_message) {
          prevBox.classList.remove('d-none');
          document.getElementById('modalRepliedDate').innerText = currentEmailData.replied_at ? new Date(currentEmailData.replied_at).toLocaleString() : '';
          document.getElementById('modalReplyText').innerText = currentEmailData.reply_message;
        } else {
          prevBox.classList.add('d-none');
        }

        detailModal.show();
        loadEmails();
      } catch (err) {
        console.error('Error opening email detail:', err);
        alert('Failed to load email details.');
      }
    }

    function applyTemplate(type) {
      const textarea = document.getElementById('replyTextarea');
      const senderName = currentEmailData ? currentEmailData.from_address.split('<')[0].trim() : 'User';

      if (type === 'account_approved') {
        textarea.value = `Hello ${senderName},\n\nYour student account registration for Trackify has been reviewed and approved by the administration team.\n\nYou can now log in to your student portal:\nhttps://app.trackifyapp.co.in/login\n\nBest regards,\nTrackify System Administration`;
      } else if (type === 'attendance_resolved') {
        textarea.value = `Hello ${senderName},\n\nYour attendance correction request has been reviewed and updated in the system.\n\nPlease log in to your student dashboard to verify your updated attendance records.\n\nBest regards,\nTrackify Administration`;
      } else if (type === 'tech_issue_resolved') {
        textarea.value = `Hello ${senderName},\n\nThe technical issue you reported has been resolved by our engineering team.\n\nPlease refresh or log back into the portal. If you continue experiencing issues, feel free to reply to this message.\n\nBest regards,\nTrackify Technical Support`;
      } else if (type === 'support_ack') {
        textarea.value = `Hello ${senderName},\n\nThank you for reaching out to Trackify Support. We have received your request and our administration team is currently investigating.\n\nWe will update you shortly.\n\nBest regards,\nTrackify Support Team`;
      }
    }

    async function submitEmailReply() {
      if (!currentEmailId) return;
      const message = document.getElementById('replyTextarea').value.trim();

      if (!message) {
        alert('Please enter a response message before sending.');
        return;
      }

      const btn = document.getElementById('sendReplyBtn');
      const spinner = document.getElementById('replySpinner');
      btn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const res = await fetch(`/api/admin/inbound-emails/${currentEmailId}/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ replyMessage: message })
        });

        const json = await res.json();
        btn.disabled = false;
        spinner.classList.add('d-none');

        if (json.success) {
          alert('Reply sent successfully!');
          detailModal.hide();
          loadEmails();
        } else {
          alert(`Failed to send reply: ${json.message}`);
        }
      } catch (err) {
        btn.disabled = false;
        spinner.classList.add('d-none');
        console.error('Reply submit error:', err);
        alert('Failed to send reply. Please check your connection.');
      }
    }

    async function toggleArchiveCurrentEmail() {
      if (!currentEmailId) return;
      try {
        const res = await fetch(`/api/admin/inbound-emails/${currentEmailId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ status: 'archived' })
        });
        const json = await res.json();
        if (json.success) {
          detailModal.hide();
          loadEmails();
        }
      } catch (err) {
        console.error('Archive error:', err);
      }
    }

    async function deleteCurrentEmail() {
      if (!currentEmailId || !confirm('Are you sure you want to delete this email record?')) return;
      try {
        const res = await fetch(`/api/admin/inbound-emails/${currentEmailId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const json = await res.json();
        if (json.success) {
          detailModal.hide();
          loadEmails();
        }
      } catch (err) {
        console.error('Delete error:', err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
