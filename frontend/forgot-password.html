<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Trackify</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/style.css?v=1.2">
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
    <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (localStorage.getItem('sidebar-collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trackify">
  <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">
  <style>
    /* Theme-specific logo toggles */
    [data-theme="dark"] .logo-light-theme {
      display: none !important;
    }
    [data-theme="dark"] .logo-dark-theme {
      display: inline-block !important;
    }
    [data-theme="light"] .logo-light-theme {
      display: inline-block !important;
    }
    [data-theme="light"] .logo-dark-theme {
      display: none !important;
    }

    /* Tactile buttons and focus feedback */
    .btn-glow {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .btn-glow:active {
      transform: scale(0.985);
    }
    .form-control:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12) !important;
    }
    [data-theme="dark"] .form-control:focus {
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2) !important;
    }
    .brand-logo-container img:hover {
      transform: scale(1.05);
    }
    .glass-card {
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .glass-card:hover {
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08) !important;
      border-color: var(--border-focus) !important;
    }
    [data-theme="dark"] .glass-card:hover {
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4) !important;
    }
  </style>
</head>
<body>

  
  <nav class="navbar navbar-expand-lg glass-nav sticky-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center text-white" href="/">
        <img src="/assets/images/logo_light.webp" alt="Trackify Logo" style="height: 32px; width: auto;">
      </a>
    </div>
  </nav>

  
  <main class="container my-5 py-5 animate-fade-in-up">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card border-glass p-5">
          <div class="text-center mb-4">
            <div class="brand-logo-container mb-3 d-flex justify-content-center align-items-center">
              <img src="/assets/images/logo_dark.webp" class="logo-light-theme mb-2" alt="Trackify Logo" style="height: 48px; width: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06)); transition: transform 0.3s ease;">
              <img src="/assets/images/logo_light.webp" class="logo-dark-theme mb-2 d-none" alt="Trackify Logo" style="height: 48px; width: auto; filter: drop-shadow(0 4px 12px rgba(255,255,255,0.08)); transition: transform 0.3s ease;">
            </div>
            <h1 class="h4 fw-bold mb-1 text-dark" style="letter-spacing: -0.02em;">Reset Password</h1>
            <p class="text-secondary small">Enter your email address and we'll help you configure a new password.</p>
          </div>

          <div id="alertContainer"></div>

          <form id="forgotForm">
            
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              <label for="email">Email Address</label>
            </div>

            
            <div id="otpResetBlock" class="d-none">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="otpCode" placeholder="6-Digit OTP" pattern="[0-9]{6}" maxlength="6">
                <label for="otpCode">Enter 6-Digit OTP</label>
                <div class="form-text text-secondary mt-1" style="font-size: 0.75rem;">
                  Note: Please check your <strong>spam or junk folder</strong> if you do not receive the email in a few minutes.
                </div>
              </div>
              <div style="position:relative; margin-bottom:1rem;">
                <div class="form-floating">
                  <input type="password" class="form-control" id="newPassword" placeholder="New Password" style="padding-right:52px;">
                  <label for="newPassword">New Password</label>
                </div>
                <button type="button" onclick="toggleFieldPwd('newPassword','fp_eyeOff1','fp_eyeOn1')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);outline:none;box-shadow:none;">
                  <svg id="fp_eyeOff1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10q9 6 18 0"/><path d="M6 12l-1.5 2.5"/><path d="M10 13v3"/><path d="M14 13v3"/><path d="M18 12l1.5 2.5"/></svg>
                  <svg id="fp_eyeOn1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
                </button>
              </div>
              <div style="position:relative; margin-bottom:1rem;">
                <div class="form-floating">
                  <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" style="padding-right:52px;">
                  <label for="confirmPassword">Confirm Password</label>
                </div>
                <button type="button" onclick="toggleFieldPwd('confirmPassword','fp_eyeOff2','fp_eyeOn2')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);outline:none;box-shadow:none;">
                  <svg id="fp_eyeOff2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10q9 6 18 0"/><path d="M6 12l-1.5 2.5"/><path d="M10 13v3"/><path d="M14 13v3"/><path d="M18 12l1.5 2.5"/></svg>
                  <svg id="fp_eyeOn2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
                </button>
              </div>
            </div>

            
            <button type="submit" class="btn btn-glow w-100 py-3 mb-3" id="submitBtn">Send Reset OTP</button>
          </form>

          <div class="text-center mt-3">
            <a href="/login" class="link-secondary text-decoration-none small fw-semibold">&larr; Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/main.js"></script>
  <script>
    let otpSent = false;

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const alertContainer = document.getElementById('alertContainer');
      const otpResetBlock = document.getElementById('otpResetBlock');
      const otpCodeInput = document.getElementById('otpCode');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      
      if (!otpSent) {
        // Send OTP
        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending OTP...';
        alertContainer.innerHTML = '';

        const response = await apiCall('/api/auth/otp/send', {
          method: 'POST',
          body: { email, purpose: 'forgot' }
        });

        submitBtn.disabled = false;
        if (response.success) {
          otpSent = true;
          document.getElementById('email').readOnly = true;
          otpResetBlock.classList.remove('d-none');
          otpCodeInput.required = true;
          newPasswordInput.required = true;
          confirmPasswordInput.required = true;
          
          submitBtn.innerText = 'Verify & Reset Password';
          showAlert(response.message, 'success');
        } else {
          submitBtn.innerText = 'Send Reset OTP';
          showAlert(response.message || 'Failed to send OTP code.', 'danger');
        }
      } else {
        // Verify OTP and reset password
        const otp = otpCodeInput.value;
        const password = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password !== confirmPassword) {
          showAlert('Passwords do not match.', 'danger');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Resetting Password...';

        const response = await apiCall('/api/auth/otp/reset', {
          method: 'POST',
          body: { email, otp, password, confirmPassword }
        });

        submitBtn.disabled = false;
        if (response.success) {
          showAlert(response.message + ' Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          submitBtn.innerText = 'Verify & Reset Password';
          showAlert(response.message || 'Verification or password update failed.', 'danger');
        }
      }
    });

    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      container.innerHTML = `
        <div class="alert alert-${type} px-3 py-2 fs-7" role="alert">
          ${message}
        </div>
      `;
    }
  </script>
  <script>
    function toggleFieldPwd(inputId, offIconId, onIconId) {
      const input = document.getElementById(inputId);
      const offIcon = document.getElementById(offIconId);
      const onIcon = document.getElementById(onIconId);
      const isHidden = input.getAttribute('type') === 'password';
      input.setAttribute('type', isHidden ? 'text' : 'password');
      offIcon.style.display = isHidden ? 'none' : '';
      onIcon.style.display = isHidden ? '' : 'none';
    }
  </script>
</body>
</html>
