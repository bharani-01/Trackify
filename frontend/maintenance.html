<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance - Trackify</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
  
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <style>
    body {
      background-color: var(--bg-primary);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Background decorative blobs */
    body::before {
      content: "";
      position: fixed;
      top: -10%;
      left: -10%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, rgba(37, 99, 235, 0.02) 50%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }
    
    body::after {
      content: "";
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, rgba(16, 185, 129, 0.01) 50%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .maintenance-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      animation: maintenanceFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .maintenance-icon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-subtle);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
    }

    .maintenance-icon-gear {
      font-size: 3rem;
      color: var(--primary);
      animation: spinGear 8s linear infinite;
    }

    .maintenance-icon-wrench {
      font-size: 1.5rem;
      color: var(--success);
      position: absolute;
      bottom: 8px;
      right: 8px;
      animation: wrenchWiggle 2.5s ease-in-out infinite;
    }

    @keyframes spinGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes wrenchWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }

    @keyframes maintenanceFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 30px;
      background-color: var(--warning-subtle);
      color: var(--warning);
      border: 1px solid rgba(217, 119, 6, 0.15);
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      box-shadow: 0 0 0 var(--warning);
      animation: pulseDotAnim 1.6s infinite;
    }

    @keyframes pulseDotAnim {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(217, 119, 6, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);
      }
    }

    .maintenance-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 2.25rem;
      line-height: 1.2;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .maintenance-desc {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .progress-bar-wrap {
      height: 6px;
      width: 100%;
      background: var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, var(--primary), var(--info));
      border-radius: 10px;
      animation: loadBar 3s ease-in-out infinite alternate;
    }

    @keyframes loadBar {
      0% { width: 10%; }
      100% { width: 90%; }
    }
  </style>
</head>
<body>

  <main class="container p-3 d-flex justify-content-center">
    <div class="maintenance-card">
      <div class="glass-card border-glass shadow-lg p-5">
        
        <div class="maintenance-icon-wrapper">
          <i class="bi bi-gear-fill maintenance-icon-gear"></i>
          <i class="bi bi-wrench maintenance-icon-wrench"></i>
        </div>

        <div class="pulse-badge">
          <span class="pulse-dot"></span>
          Scheduled Optimization Active
        </div>

        <h1 class="maintenance-title">System Under Maintenance</h1>
        
        <p class="maintenance-desc">
          Trackify is currently undergoing routine database indexing and engine optimization. We are upgrading database schemas to deliver faster loading speeds and a smoother user experience.
        </p>

        <div class="progress-bar-wrap">
          <div class="progress-bar-fill"></div>
        </div>

        <div class="border-top pt-4 mt-2">
          <div class="small text-muted mb-2">Are you a system administrator?</div>
          <a href="/login" class="btn btn-glass btn-sm px-4 py-2" style="font-size: 0.8rem;">
            <i class="bi bi-shield-lock-fill me-1"></i> Admin Authorization Portal
          </a>
        </div>

      </div>
    </div>
  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
