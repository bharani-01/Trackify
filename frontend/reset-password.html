<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Trackify</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/style.css?v=1.2">
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
    <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (localStorage.getItem('sidebar-collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trackify">
  <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">
</head>
<body>

  
  <nav class="navbar navbar-expand-lg glass-nav sticky-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center text-white" href="/">
        <img src="/assets/images/logo_light.webp" alt="Trackify Logo" style="height: 32px; width: auto;">
      </a>
    </div>
  </nav>

  
  <main class="container my-5 py-5 animate-fade-in-up">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card border-glass p-5">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Create New Password</h1>
            <p class="text-secondary small">Define your new credentials to restore access to your account.</p>
          </div>

          <div id="alertContainer"></div>

          <form id="resetForm">
            
            <input type="hidden" id="token">

            
            <div style="position:relative; margin-bottom:1rem;">
              <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="New Password" style="padding-right:52px;" required minlength="6">
                <label for="password">New Password (min 6 chars)</label>
              </div>
              <button type="button" onclick="toggleFieldPwd('password','rp_eyeOff1','rp_eyeOn1')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);outline:none;box-shadow:none;">
                <svg id="rp_eyeOff1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10q9 6 18 0"/><path d="M6 12l-1.5 2.5"/><path d="M10 13v3"/><path d="M14 13v3"/><path d="M18 12l1.5 2.5"/></svg>
                <svg id="rp_eyeOn1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
              </button>
            </div>

            
            <div style="position:relative; margin-bottom:1.5rem;">
              <div class="form-floating">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" style="padding-right:52px;" required minlength="6">
                <label for="confirmPassword">Confirm Password</label>
              </div>
              <button type="button" onclick="toggleFieldPwd('confirmPassword','rp_eyeOff2','rp_eyeOn2')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;background:none;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);outline:none;box-shadow:none;">
                <svg id="rp_eyeOff2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10q9 6 18 0"/><path d="M6 12l-1.5 2.5"/><path d="M10 13v3"/><path d="M14 13v3"/><path d="M18 12l1.5 2.5"/></svg>
                <svg id="rp_eyeOn2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
              </button>
            </div>

            
            <button type="submit" class="btn btn-glow w-100 py-3 mb-3" id="submitBtn">Update Password</button>
          </form>

          <div class="text-center mt-2">
            <a href="/login" class="link-secondary text-decoration-none small fw-semibold">&larr; Cancel and Log In</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/main.js"></script>
  <script>
    // Extract token parameter from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertContainer = document.getElementById('alertContainer');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      alertContainer.innerHTML = `
        <div class="alert alert-danger px-3 py-2 fs-7" role="alert">
          Invalid or missing recovery token. Please request another password reset.
        </div>
      `;
      submitBtn.disabled = true;
    } else {
      document.getElementById('token').value = token;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertContainer = document.getElementById('alertContainer');
      
      if (password !== confirmPassword) {
        alertContainer.innerHTML = `
          <div class="alert alert-danger px-3 py-2 fs-7" role="alert">
            Passwords do not match. Please verify your entries.
          </div>
        `;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Updating...';
      alertContainer.innerHTML = '';

      const response = await apiCall('/api/auth/reset-password', {
        method: 'POST',
        body: { token, password, confirmPassword }
      });

      if (response.success) {
        alertContainer.innerHTML = `
          <div class="alert alert-success px-3 py-2 fs-7" role="alert">
            Your password was updated successfully! Redirecting you to login...
          </div>
        `;
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';
        alertContainer.innerHTML = `
          <div class="alert alert-danger px-3 py-2 fs-7" role="alert">
            ${response.message || 'Failed to update password.'}
          </div>
        `;
      }
    });
  </script>
  <script>
    function toggleFieldPwd(inputId, offIconId, onIconId) {
      const input = document.getElementById(inputId);
      const offIcon = document.getElementById(offIconId);
      const onIcon = document.getElementById(onIconId);
      const isHidden = input.getAttribute('type') === 'password';
      input.setAttribute('type', isHidden ? 'text' : 'password');
      offIcon.style.display = isHidden ? 'none' : '';
      onIcon.style.display = isHidden ? '' : 'none';
    }
  </script>
</body>
</html>
